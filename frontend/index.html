<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessForm - Accessible Survey Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *:focus { outline: 3px solid #005fcc !important; outline-offset: 2px !important; }
        .skip-link { position: absolute; top: -40px; left: 0; background: #000; color: white; padding: 8px; z-index: 100; text-decoration: none; }
        .skip-link:focus { top: 0; }
        .high-contrast { background-color: #000 !important; color: #fff !important; }
        .high-contrast .card { background-color: #222 !important; color: #fff !important; border-color: #fff !important; }
        .dyslexia-mode { font-family: 'Comic Sans MS', 'OpenDyslexic', Arial, sans-serif !important; }
        .login-container { max-width: 500px; margin: auto; }
        .forgot-link { color: #6c5ce7; text-decoration: none; font-size: 14px; }
        .forgot-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Accessibility Toolbar -->
    <div class="bg-light py-2" role="region" aria-label="Accessibility options">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-auto">
                    <span class="me-2"><i class="fas fa-universal-access"></i> Accessibility:</span>
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-outline-secondary" onclick="toggleHighContrast()">High Contrast</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-outline-secondary" onclick="toggleDyslexiaMode()">Dyslexia Font</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-outline-secondary" onclick="increaseFontSize()">A+</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-sm btn-outline-secondary" onclick="decreaseFontSize()">A-</button>
                </div>
            </div>
        </div>
    </div>

    <main id="main-content" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h1 class="h4 mb-0">
                            <i class="fas fa-accessible-icon me-2"></i>
                            AccessForm - Accessible Survey Builder
                        </h1>
                    </div>
                    <div class="card-body">
                        <!-- Role Selection -->
                        <div class="mb-4 text-center">
                            <label class="form-label fw-bold">Select Your Role:</label>
                            <div class="btn-group w-100 mt-2" role="group">
                                <input type="radio" class="btn-check" name="role" id="roleCreator" autocomplete="off" checked>
                                <label class="btn btn-outline-primary" for="roleCreator">
                                    <i class="fas fa-pen me-2"></i>Form Creator
                                </label>
                                <input type="radio" class="btn-check" name="role" id="roleRespondent" autocomplete="off">
                                <label class="btn btn-outline-primary" for="roleRespondent">
                                    <i class="fas fa-poll me-2"></i>Respondent
                                </label>
                                <input type="radio" class="btn-check" name="role" id="roleAdmin" autocomplete="off">
                                <label class="btn btn-outline-primary" for="roleAdmin">
                                    <i class="fas fa-cog me-2"></i>Admin
                                </label>
                            </div>
                        </div>
                        
                        <!-- Login Form - CLEAN (No pre-filled values) -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-sign-in-alt me-2"></i>Login
                                </button>
                                <button type="button" class="btn btn-outline-secondary" onclick="showSignup()">
                                    <i class="fas fa-user-plus me-2"></i>Create New Account
                                </button>
                            </div>
                            <div class="text-center mt-3">
                                <a href="forgot-password.html" class="forgot-link">
                                    <i class="fas fa-key me-1"></i>Forgot Password?
                                </a>
                            </div>
                        </form>

                        <!-- Signup Form -->
                        <form id="signupForm" style="display: none;">
                            <h4 class="text-center mb-3">Create New Account</h4>
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="signupName" placeholder="Enter your full name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" class="form-control" id="signupEmail" placeholder="Enter your email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="signupPassword" placeholder="Create a password" required>
                                <div class="form-text">Minimum 6 characters</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">I want to</label>
                                <select class="form-select" id="signupRole">
                                    <option value="creator">Create Forms (Creator)</option>
                                    <option value="respondent">Take Surveys (Respondent)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone Number (Optional)</label>
                                <input type="tel" class="form-control" id="signupPhone" placeholder="+923001234567">
                            </div>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-success" onclick="register()">
                                    <i class="fas fa-user-plus me-2"></i>Sign Up
                                </button>
                                <button type="button" class="btn btn-link" onclick="showLogin()">
                                    Already have an account? Login
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-light text-center">
                        <small>
                            <i class="fas fa-check-circle text-success me-1"></i>
                            WCAG 2.1 AA Compliant | Screen Reader Optimized | Keyboard Navigable
                        </small>
                    </div>
                </div>
                <div id="message" class="mt-3 text-center"></div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            document.getElementById('message').innerHTML = '';
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('message').innerHTML = '';
        }

        async function register() {
            const full_name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const role = document.getElementById('signupRole').value;
            const phone_number = document.getElementById('signupPhone').value.trim();

            const messageDiv = document.getElementById('message');

            if (!full_name) {
                messageDiv.innerHTML = '<div class="alert alert-danger">Please enter your full name.</div>';
                return;
            }
            if (!email) {
                messageDiv.innerHTML = '<div class="alert alert-danger">Please enter your email address.</div>';
                return;
            }
            if (!password || password.length < 6) {
                messageDiv.innerHTML = '<div class="alert alert-danger">Password must be at least 6 characters.</div>';
                return;
            }

            messageDiv.innerHTML = '<div class="alert alert-info"><i class="fas fa-spinner fa-spin me-2"></i>Creating account...</div>';

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, email, password, role, phone_number })
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            Account created successfully! Please login.
                        </div>
                    `;
                    showLogin();
                    document.getElementById('email').value = '';
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let role = 'creator';
            if (document.getElementById('roleRespondent').checked) role = 'respondent';
            if (document.getElementById('roleAdmin').checked) role = 'admin';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageDiv = document.getElementById('message');
            
            if (!email || !password) {
                messageDiv.innerHTML = '<div class="alert alert-danger">Please enter email and password.</div>';
                return;
            }
            
            const submitBtn = document.querySelector('#loginForm button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            submitBtn.disabled = true;
            messageDiv.innerHTML = '';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    messageDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
                    
                    setTimeout(() => {
                        if (role === 'creator') window.location.href = 'dashboard-creator.html';
                        else if (role === 'admin') window.location.href = 'dashboard-admin.html';
                        else window.location.href = 'dashboard-respondent.html';
                    }, 1000);
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger">Login failed: ${data.message || 'Invalid credentials'}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // =============================================
        // ACCESSIBILITY FUNCTIONS
        // =============================================
        function toggleHighContrast() {
            document.body.classList.toggle('high-contrast');
            localStorage.setItem('highContrast', document.body.classList.contains('high-contrast'));
        }
        
        function toggleDyslexiaMode() {
            document.body.classList.toggle('dyslexia-mode');
            localStorage.setItem('dyslexiaMode', document.body.classList.contains('dyslexia-mode'));
        }
        
        function increaseFontSize() {
            let currentSize = parseFloat(getComputedStyle(document.body).fontSize);
            document.body.style.fontSize = (currentSize + 2) + 'px';
        }
        
        function decreaseFontSize() {
            let currentSize = parseFloat(getComputedStyle(document.body).fontSize);
            if (currentSize > 12) {
                document.body.style.fontSize = (currentSize - 2) + 'px';
            }
        }

        if (localStorage.getItem('highContrast') === 'true') {
            document.body.classList.add('high-contrast');
        }
        if (localStorage.getItem('dyslexiaMode') === 'true') {
            document.body.classList.add('dyslexia-mode');
        }
        
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (token && user.role) {
            if (user.role === 'creator') window.location.href = 'dashboard-creator.html';
            else if (user.role === 'admin') window.location.href = 'dashboard-admin.html';
            else if (user.role === 'respondent') window.location.href = 'dashboard-respondent.html';
        }
    </script>
</body>
</html>
