<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AccessForm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *:focus { outline: 3px solid #005fcc !important; outline-offset: 2px !important; }
        body { background: #f5f5f5; padding: 50px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .btn-primary { background: #6c5ce7; border: none; }
        .btn-primary:hover { background: #5b4bc4; }
        .high-contrast { background-color: #000 !important; color: #fff !important; }
        .high-contrast .container { background-color: #222 !important; color: #fff !important; }
        .dyslexia-mode { font-family: 'Comic Sans MS', 'OpenDyslexic', Arial, sans-serif !important; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center"><i class="fas fa-key me-2"></i>Reset Password</h2>
        <p class="text-center text-muted">Enter your new password below.</p>
        
        <div id="tokenStatus" class="mb-3"></div>
        
        <form id="resetPasswordForm">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required minlength="6">
                <small class="text-muted">Minimum 6 characters</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-save me-2"></i>Reset Password
            </button>
        </form>
        
        <div id="message" class="mt-3"></div>
        <p class="text-center mt-3">
            <a href="index.html"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
        </p>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function toggleHighContrast() {
            document.body.classList.toggle('high-contrast');
            localStorage.setItem('highContrast', document.body.classList.contains('high-contrast'));
        }
        
        function toggleDyslexiaMode() {
            document.body.classList.toggle('dyslexia-mode');
            localStorage.setItem('dyslexiaMode', document.body.classList.contains('dyslexia-mode'));
        }

        if (localStorage.getItem('highContrast') === 'true') document.body.classList.add('high-contrast');
        if (localStorage.getItem('dyslexiaMode') === 'true') document.body.classList.add('dyslexia-mode');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const form = document.getElementById('resetPasswordForm');
        const tokenStatus = document.getElementById('tokenStatus');

        if (!token) {
            tokenStatus.innerHTML = '<div class="alert alert-danger">Invalid reset link. Please request a new one.</div>';
            form.style.display = 'none';
        } else {
            // Verify token
            (async () => {
                try {
                    const response = await fetch(`${API_URL}/auth/verify-reset-token?token=${token}`);
                    const data = await response.json();
                    if (data.success) {
                        tokenStatus.innerHTML = `<div class="alert alert-success">✅ Verified! Please enter your new password.</div>`;
                    } else {
                        tokenStatus.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                        form.style.display = 'none';
                    }
                } catch (error) {
                    tokenStatus.innerHTML = `<div class="alert alert-danger">Error verifying token</div>`;
                    form.style.display = 'none';
                }
            })();
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.querySelector('button[type="submit"]');
            
            if (newPassword !== confirmPassword) {
                messageDiv.innerHTML = '<div class="alert alert-danger">Passwords do not match.</div>';
                return;
            }
            
            if (newPassword.length < 6) {
                messageDiv.innerHTML = '<div class="alert alert-danger">Password must be at least 6 characters.</div>';
                return;
            }
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
            submitBtn.disabled = true;
            messageDiv.innerHTML = '';
            
            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            ${data.message}
                        </div>
                    `;
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-save me-2"></i>Reset Password';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
