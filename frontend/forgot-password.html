<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AccessForm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *:focus { outline: 3px solid #005fcc !important; outline-offset: 2px !important; }
        body { background: #f5f5f5; padding: 50px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .btn-primary { background: #6c5ce7; border: none; }
        .btn-primary:hover { background: #5b4bc4; }
        .high-contrast { background-color: #000 !important; color: #fff !important; }
        .high-contrast .container { background-color: #222 !important; color: #fff !important; }
        .dyslexia-mode { font-family: 'Comic Sans MS', 'OpenDyslexic', Arial, sans-serif !important; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center"><i class="fas fa-lock me-2"></i>Forgot Password</h2>
        <p class="text-center text-muted">Enter your email address and we'll send you a reset link.</p>
        
        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-paper-plane me-2"></i>Send Reset Link
            </button>
        </form>
        
        <div id="message" class="mt-3"></div>
        <p class="text-center mt-3">
            <a href="index.html"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
        </p>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function toggleHighContrast() {
            document.body.classList.toggle('high-contrast');
            localStorage.setItem('highContrast', document.body.classList.contains('high-contrast'));
        }
        
        function toggleDyslexiaMode() {
            document.body.classList.toggle('dyslexia-mode');
            localStorage.setItem('dyslexiaMode', document.body.classList.contains('dyslexia-mode'));
        }

        if (localStorage.getItem('highContrast') === 'true') document.body.classList.add('high-contrast');
        if (localStorage.getItem('dyslexiaMode') === 'true') document.body.classList.add('dyslexia-mode');

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.querySelector('button[type="submit"]');
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            submitBtn.disabled = true;
            messageDiv.innerHTML = '';
            
            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            ${data.message}
                            ${data.resetLink ? `<br><small class="text-muted mt-2 d-block">🔗 Reset link: <a href="${data.resetLink}" target="_blank">Click here to reset password</a></small>` : ''}
                        </div>
                    `;
                    document.getElementById('email').value = '';
                } else {
                    messageDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send Reset Link';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
